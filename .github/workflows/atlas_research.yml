name: ATLAS Research + GitHub Pages

on:
  # GitHub có thể chạy trễ so với lịch khi hệ thống đang tải cao.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: atlas-research-pages-node-1
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ATLAS_RESEARCH_TOPICS: "trí tuệ nhân tạo mới nhất,công nghệ mới nhất,tin Việt Nam mới nhất"
  ATLAS_RESEARCH_SERVER: "duckduckgo-web-search"
  ATLAS_RESEARCH_RESULTS_PER_TOPIC: "3"
  ATLAS_RESEARCH_FETCH_TOP: "1"
  ATLAS_RESEARCH_MAX_ITEMS: "100"

  ATLAS_RESEARCH_OUTPUT: "site/atlas_research_node1.json"
  ATLAS_MCP_CONFIG: "mcp_research_config.json"

  ATLAS_TOOL_TIMEOUT_SECONDS: "45"
  ATLAS_REMOTE_CACHE_TIMEOUT_SECONDS: "12"
  ATLAS_FETCH_MAX_LENGTH: "8000"

jobs:
  build:
    name: Research and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create live research MCP config
        run: |
          cat > mcp_research_config.json <<'EOF'
          {
            "mcpServers": {
              "duckduckgo-web-search": {
                "type": "stdio",
                "command": "uvx",
                "args": [
                  "--with",
                  "duckduckgo-mcp-server[browser]",
                  "duckduckgo-mcp-server",
                  "--fetch-backend",
                  "auto"
                ],
                "env": {
                  "DDG_SAFE_SEARCH": "STRICT",
                  "DDG_REGION": "wt-wt",
                  "DDG_SEARCH_BACKEND": "auto"
                }
              }
            }
          }
          EOF

      - name: Static Python syntax audit
        run: |
          python -m py_compile research_worker.py
          python -m py_compile atlas_cache_mcp_proxy.py
          python -m py_compile mcp_pipe.py

      - name: Prepare Pages directory
        run: mkdir -p site

      - name: Run ATLAS Research Worker
        run: python research_worker.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy research cache to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
